    /* Motion polish: quiet, consistent feedback without touching the Tinder-style deck. */
    :root{

      --ease-out:cubic-bezier(.32,.72,0,1);

      --ease-spring:cubic-bezier(.34,1.56,.64,1);
    }
    .btn,
    .option,
    .choice-row,
    .setting,
    .meal-card,
    .group-head,
    .acc-head,
    .icon-btn,
    .round,
    .qty button,
    .box,
    .pill,
    .change-btn,
    .add-line{
      transition:transform var(--motion-fast) var(--ease-soft),
        background-color var(--motion-fast) ease,
        border-color var(--motion-fast) ease,
        color var(--motion-fast) ease,
        box-shadow var(--motion-fast) ease,
        opacity var(--motion-fast) ease;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:active,
    .option:active,
    .choice-row:active,
    .setting:active,
    .meal-card:active,
    .group-head:active,
    .acc-head:active,
    .round:active,
    .qty button:active,
    .pill:active,
    .change-btn:active,
    .add-line:active{
      transform:scale(.985);
    }
    .icon-btn:active,
    .box:active{
      transform:scale(.92);
    }
    .search,
    .unit-select{
      transition:box-shadow var(--motion-med) ease,

 if(s===7){const imgs={practica:'práctica.png',balanceada:'balanceada.png',variada:'variada.png'},txt={practica:'Priorizamos platos prácticos y una compra más simple.',balanceada:'Combinamos variedad y una compra fácil de manejar.',variada:'Alternamos más tipos de comida durante la semana.'},idx=['practica','balanceada','variada'].indexOf(state.variety);body=`${head(7)}<h1 class="title">¿Qué tan variados quieres tus platos?</h1><p class="copy">Más variedad significa alternar más tipos de comida durante la semana, aunque también implica una compra un poco más amplia.</p><img class="hero-img" id="varietyImg" src="assets/${imgs[state.variety]}"><p class="variety-copy" id="varietyCopy">${txt[state.variety]}</p><div class="slider" id="varietySlider" style="--slider-pct:${idx*50}%"><input type="range" min="0" max="2" value="${idx}" oninput="setVariety(this.value)"><div class="slider-labels" id="varietyLabels"><span class="${state.variety==='practica'?'active':''}">Práctica</span><span class="${state.variety==='balanceada'?'active':''}">Balanceada</span><span class="${state.variety==='variada'?'active':''}">Muy Variada</span></div></div>`}
 if(s===8){button=state.deck>=dishes.length?'Ver mi plan':(state.sel.length>=20?'Continuar':'Selecciona mínimo 20 platos');disabled=state.sel.length<20;body=swipeStep()}

function swipeStep(){
 const selected=state.sel.length,pct=Math.min(100,selected/20*100),done=state.deck>=dishes.length;
 const progress=`<div class="dish-top"><h1 class="title" style="margin-top:24px">Ahora elige tus platos</h1><p class="intro copy" style="font-size:16px">Desliza derecha para incluir en tu plan, y a la izquierda para descartarlo.</p><div class="dish-progress-card"><strong>${selected}/20 platos elegidos</strong>${selected>=20&&!done?'<button class="skip-link" onclick="nextOnboard()">Saltar</button>':''}<small>${selected<20?'falta seleccionar '+(20-selected)+' platos como mínimo':'mínimo listo, puedes seguir eligiendo'}</small><div class="mini-progress"><i style="width:${pct}%"></i></div></div></div>`;
 const content=done
  ? `<div class="done-card show"><h2>Selección lista</h2><p>Elegiste ${selected} platos. Luego podrás agregar más desde ajustes.</p></div>`
  : `<div class="deck">${dishes.slice(state.deck,state.deck+3).map((d,i)=>`<article class="dish-card" style="z-index:${3-i}" data-i="${i}"><span class="stamp si">SÍ</span><span class="stamp no">NO</span><div class="dish-photo"><img src="${img(d)}"><b class="dish-name">${d.n}</b><span class="dish-count">${state.deck+i+1}/${dishes.length}</span></div><div class="swipe-actions"><button class="no" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();animatePick(false)"><img src="assets/icon-xmark.svg" alt="">No</button><button class="yes" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();animatePick(true)"><img src="assets/icon-checkmark.svg" alt="">Sí</button></div></article>`).join('')}</div>`;
 return `${head(8)}${progress}${content}`;
}

function toggleArr(a,v){const i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v)}
function preserveOnboardScroll(id,fn){const el=document.getElementById(id),top=el?el.scrollTop:0;fn();state.onboardScroll[id]=top;render();requestAnimationFrame(()=>{const next=document.getElementById(id);if(next)next.scrollTop=state.onboardScroll[id]||0})}
function foldText(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function preserveScroll(selector,fn){const el=document.querySelector(selector),top=el?el.scrollTop:0;fn();render();requestAnimationFrame(()=>{const next=document.querySelector(selector);if(next)next.scrollTop=top})}
function motionUpdate(fn,kind='motion-active'){document.body.classList.add('motion-active',kind);fn();render();setTimeout(()=>document.body.classList.remove('motion-active',kind),460)}
function navIndex(tab=state.tab){return {week:0,shop:1,settings:2}[tab]??0}
function switchTab(tab){if(state.tab===tab)return;const from=navIndex(state.tab),to=navIndex(tab);state.navVisualIndex=from;state.tab=tab;state.detail=false;render();requestAnimationFrame(()=>{const nav=document.querySelector('.nav');if(!nav)return;nav.style.setProperty('--active-index',to);state.navVisualIndex=to;setTimeout(()=>{state.navVisualIndex=null},380)})}

function setVariety(v){

 state.variety=opts[value];

function pickDish(yes){const d=dishes[state.deck];if(!d)return;if(yes)state.sel.push(d.n);else state.rej.push(d.n);state.deck++;render()}
function animatePick(yes){
 const card=document.querySelector('.dish-card');
 if(!card){pickDish(yes);return}
 const deck=document.querySelector('.deck');
 if(deck)deck.classList.add('stack-advance');
 card.classList.add(yes?'exit-yes':'exit-no');
 card.querySelector(yes?'.stamp.si':'.stamp.no').style.opacity=1;
 setTimeout(()=>pickDish(yes),220);
}
function bindSwipe(){
 const card=document.querySelector('.dish-card');
 if(!card)return;
 let startX=0,startY=0,dx=0,dy=0,down=false;
 card.addEventListener('pointerdown',e=>{down=true;startX=e.clientX;startY=e.clientY;card.setPointerCapture(e.pointerId);card.classList.add('dragging')});
 card.addEventListener('pointermove',e=>{
  if(!down)return;dx=e.clientX-startX;dy=e.clientY-startY;
  card.style.transform=`translate(${dx}px,${dy*.2}px) rotate(${dx/16}deg)`;
  card.style.background=dx>0?'#eaf8ea':dx<0?'#fff0f0':'#eef1f4';
  card.querySelector('.stamp.si').style.opacity=Math.max(0,Math.min(1,dx/90));
  card.querySelector('.stamp.no').style.opacity=Math.max(0,Math.min(1,-dx/90));
 });
 card.addEventListener('pointerup',()=>{
  if(!down)return;down=false;card.classList.remove('dragging');
  if(Math.abs(dx)>95){animatePick(dx>0);return}
  card.style.transform='';card.style.background='';
  card.querySelector('.stamp.si').style.opacity=0;card.querySelector('.stamp.no').style.opacity=0;
 });
}
function loading(){ $phone.innerHTML=`<section class="screen active gradient loader-screen"><h1 class="title" style="text-align:center">Preparando<br>tu plan</h1><p class="copy" style="text-align:center">Tus respuestas están siendo procesadas para proponerte el menú semanal y plan de compras ideales para ti.</p><div class="loader-ring" id="ring"><span id="pct">0%</span></div><div class="steps">${['Analizando preferencias','Combinando platos','Organizando compra'].map((t,i)=>`<div class="load-step" id="ls${i}"><div class="bullet">${i===0?'✓':''}</div><div><strong>${t}</strong><small>Pendiente</small></div></div>`).join('')}</div></section>`}

function fmt(n){if(n===0)return '0';const whole=Math.floor(n),frac=Math.round((n-whole)*4);if(frac===0)return String(whole);const parts={1:'1/4',2:'1/2',3:'3/4',4:''};return `${whole?whole+' ':''}${parts[frac]||String(n)}`.trim()}

function adjustRecipeIng(i,delta){const list=currentRecipeIngs();if(!list[i])return;list[i].q=Math.max(.5,list[i].q+delta);week[state.day].editedIngs=true;state.shopAdjustments={};const el=document.getElementById('ingQty'+i);if(el)el.textContent=fmt(list[i].q);markDirty()}
function removeRecipeIng(i){const sc=document.querySelector('.detail-scroll'),top=sc?sc.scrollTop:0;currentRecipeIngs().splice(i,1);week[state.day].editedIngs=true;state.shopAdjustments={};state.dirty=true;render();requestAnimationFrame(()=>{const s=document.querySelector('.detail-scroll');if(s)s.scrollTop=top})}
function catProgress(c){const list=shoppingItems().filter(i=>c==='Todo'||i.cat===c);return `${list.filter(i=>state.bought.includes(i.n)).length}/${list.length}`}
function shopTab(){const scope=shopScope(),items=shoppingItems(scope);const baseCats=['Todo','Verduras','Abarrotes','Carnes','Avícola','Pescados'];const cats=baseCats.filter(c=>c==='Todo'||items.some(i=>i.cat===c));const visible=state.shopFilter==='Todo'?items:items.filter(i=>i.cat===state.shopFilter);const grouped={};visible.forEach(i=>(grouped[i.cat]??=[]).push(i));const boughtCount=items.filter(i=>state.bought.includes(i.n)).length;return `<section class="screen active app-screen shop-screen"><div class="app-head"><div class="app-head-row"><div><div class="app-title">Compras</div><button class="week-select" onclick="openShopScopeDrawer()"><span>${scope}</span><span class="chev">${svg('<path d="M6 9l6 6 6-6"/>')}</span></button></div><button class="icon-btn share-btn add-product" onclick="openProductDrawer()" aria-label="Agregar">${svg('<path d="M12 5v14M5 12h14"/>')}</button></div><div class="shopping-progress"><strong>${boughtCount} de ${items.length} comprados <span class="shop-scope">${scope}</span></strong><small>Te faltan ${items.length-boughtCount} productos</small><div class="mini-progress"><i style="width:${items.length?boughtCount/items.length*100:0}%"></i></div></div><div class="shop-tabs">${cats.map(c=>`<button class="${state.shopFilter===c?'active':''}" onclick="state.shopFilter='${c}';render()"><span>${c}</span><small>${catProgress(c)}</small></button>`).join('')}</div></div><div class="shop-list">${Object.entries(grouped).map(([c,items])=>{const open=!state.closedGroups.includes(c);return `<div class="group ${open?'open':''} ${state.motionGroup===c?'motion-target':''}"><button class="group-head" onclick="toggleGroup('${c}')"><b>${c}</b><span class="group-meta"><small>${items.length} PRODUCTOS</small><span class="acc-chevron ${open?'up':''}">${svg('<path d="M6 9l6 6 6-6"/>')}</span></span></button><div class="group-body">${items.map((it,i)=>shopRow(it)).join('')}</div></div>`}).join('')}</div></section>`}
function shopRow(it){const checked=state.bought.includes(it.n),name=it.n.replace(/'/g,"\\'"),expanded=state.expandedUses.includes(it.n),long=it.use.length>24||it.uses?.length>1||it.use.includes(' · ');return `<div class="shop-row ${it.q===0?'zero':''}"><button class="box ${checked?'checked':''}" onclick="toggleArr(state.bought,'${name}');render()">${checked?uiIcon('check'):''}</button><div><b>${it.n}</b><small class="shop-use ${expanded?'expanded':''}"><span class="shop-use-text">${it.use}</span>${long?`<button onclick="event.stopPropagation();toggleUse('${name}')">${expanded?'Menos':'Más'}</button>`:''}</small></div><div class="qty"><button onclick="adjustShopQty('${name}',-1)">−</button><span>${fmt(it.q)} ${it.u}</span><button onclick="adjustShopQty('${name}',1)">+</button></div></div>`}
function adjustShopQty(name,delta){const item=shoppingItems().find(i=>i.n===name);if(!item)return;state.shopAdjustments[name]=Math.max(0,(state.shopAdjustments[name]??item.q)+delta);render()}

function startDayCardSwipe(e,i){const card=e.currentTarget,wrap=card.closest('.meal-swipe'),slide=wrap?.querySelector('.day-slide');if(!wrap||!slide||wrap.classList.contains('locked'))return;closeDaySwipes(wrap.id);let startX=e.clientX,startY=e.clientY,dx=0,dy=0,drag=false,vertical=false;card.dataset.swiped='0';const base=wrap.classList.contains('open')?-82:0;const move=ev=>{dx=ev.clientX-startX;dy=ev.clientY-startY;if(!drag&&!vertical&&Math.abs(dy)>Math.abs(dx)+8){vertical=true;return}if(vertical)return;if(Math.abs(dx)>8){drag=true;ev.preventDefault();const x=Math.max(-82,Math.min(0,base+dx));slide.style.transform=`translateX(${x}px)`}};const finish=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',finish);slide.style.transform='';if(!drag)return;if(Math.abs(dy)>Math.abs(dx)+12){wrap.classList.toggle('open',base<0)}else{wrap.classList.toggle('open',base+dx<-42)}card.dataset.swiped='1';setTimeout(()=>card.dataset.swiped='0',100)};window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',finish,{once:true});window.addEventListener('pointercancel',finish,{once:true})}

function filterSettingPlates(q){document.getElementById('settingPlates').innerHTML=settingPlatesList(q)}
function toggleSettingPlate(btn,n){toggleArr(settingDraft.active,n);const on=settingDraft.active.includes(n);btn.classList.toggle('selected',on);btn.querySelector('em').textContent=on?'Activo':'Inactivo';enableSettingSave(settingDraft.active.join('|')!==activeDishNames().join('|'))}
function saveSetting(){const kind=settingDraft.kind;if(kind==='people'){state.people=settingDraft.people;rescalePlan()}if(kind==='portion'){state.portion=settingDraft.portion;rescalePlan()}if(kind==='market'){state.market=settingDraft.market;state.shopScope=null;state.shopAdjustments={};state.bought=[]}if(kind==='nocook'){state.noCook=[...settingDraft.noCook];buildWeek()}if(kind==='variety'){state.variety=settingDraft.variety;buildWeek()}if(kind==='plates'){state.activeDishes=[...settingDraft.active];buildWeek()}closeDrawer();render();toast('Ajuste guardado')}
function openSessionDrawer(){openDrawer(`<button class="x" onclick="closeDrawer()" aria-label="Cerrar"></button><h3>Cerrar sesión</h3><div class="setting-drawer"><p class="drawer-note">Volverás a la pantalla de inicio. Tu prototipo local seguirá disponible para probar.</p></div><button class="btn drawer-primary" onclick="state.route='login';closeDrawer();render()">Cerrar sesión</button>`)}
function openDeleteDrawer(){openDrawer(`<button class="x" onclick="closeDrawer()" aria-label="Cerrar"></button><h3>Eliminar cuenta</h3><div class="setting-drawer"><p class="drawer-note">Esta acción reinicia los datos del prototipo y vuelve al inicio.</p></div><button class="btn drawer-primary danger-btn" onclick="state.route='login';state.sel=[];state.rej=[];state.deck=0;state.activeDishes=null;week=[];manualProducts=[];state.shopAdjustments={};closeDrawer();render()">Eliminar cuenta</button>`)}
function sharePlan(){navigator.share?navigator.share({title:'Mi plan semanal',text:week.map((d,i)=>days[i]+': '+d.n).join('\\n')}):toast('Resumen copiado')}
function toast(t){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast show';el.textContent=t;$phone.appendChild(el);setTimeout(()=>el.remove(),1500)}
function drawerKeyboard(on){const d=document.getElementById('drawer');if(d)d.classList.toggle('keyboard',!!on);syncViewportHeight()}
async function currentUser(){if(!sbClient)return null;const {data}=await sbClient.auth.getSession();return data.session?.user||null}
async function startGuest(){try{let user=await currentUser();if(!user&&sbClient){const {data,error}=await sbClient.auth.signInAnonymously();if(error)throw error;user=data.user}state.userId=user?.id||null;if(state.userId)await sbClient.from('profiles').upsert({id:state.userId,display_name:'Invitado'},{onConflict:'id'})}catch(err){console.warn('Guest auth fallback',err);state.userId=null;toast('Modo invitado local')}state.route='onboard';state.on=0;render()}
async function saveOnboarding(){const user=await currentUser();if(!user||!sbClient)return false;state.userId=user.id;const prefs={user_id:user.id,onboarding_completed:true,people:state.people,portion:state.portion,market_frequency:state.market||'1 vez por semana',no_cook_days:state.noCook,quick_days:state.quick,variety:state.variety};const {error:prefError}=await sbClient.from('user_preferences').upsert(prefs,{onConflict:'user_id'});if(prefError)throw prefError;const choices=[...state.sel.map(n=>({name:n,status:'accepted'})),...state.rej.map(n=>({name:n,status:'rejected'}))].map(x=>{const d=dishes.find(d=>d.n===x.name);return d?.id?{user_id:user.id,dish_id:d.id,status:x.status,enabled:x.status==='accepted'}:null}).filter(Boolean);if(choices.length){const {error}=await sbClient.from('user_dishes').upsert(choices,{onConflict:'user_id,dish_id'});if(error)throw error}return true}
async function supabaseTable(path){if(!SUPABASE_URL||!SUPABASE_PUBLISHABLE_KEY)return null;const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`}});if(!res.ok)throw new Error(`Supabase ${res.status}: ${path}`);return res.json()}
async function loadSupabaseCatalog(){try{const [remoteDishes,remoteIngs,remoteSteps]=await Promise.all([
 supabaseTable('dishes?select=id,slug,name,base,preparation,category,preparation_key,image_path&is_active=eq.true&order=created_at.asc'),
 supabaseTable('dish_ingredients?select=quantity,unit,sort_order,dishes(slug,name),ingredients(name,category)&order=sort_order.asc'),
 supabaseTable('recipe_steps?select=step_number,body,dishes(slug,name)&order=step_number.asc')
]);if(!remoteDishes?.length)return;const next=remoteDishes.map(d=>({id:d.id,slug:d.slug,n:d.name,img:d.image_path,base:d.base,prep:d.preparation,cat:d.category,p:d.preparation_key}));dishes.splice(0,dishes.length,...next);const recipes={},steps={};(remoteIngs||[]).forEach(row=>{const name=row.dishes?.name,ing=row.ingredients?.name;if(!name||!ing)return;(recipes[name]??=[]).push({n:ing,u:row.unit,q:Number(row.quantity),sort:row.sort_order})});Object.entries(recipes).forEach(([name,list])=>{dishRecipes[name]=list.sort((a,b)=>a.sort-b.sort).map(x=>[x.n,x.u,x.q])});(remoteSteps||[]).forEach(row=>{const name=row.dishes?.name;if(!name)return;(steps[name]??=[])[Number(row.step_number)-1]=row.body});Object.assign(dishSteps,steps);state.catalogSource='supabase'}catch(err){console.warn('Using local catalog fallback',err);state.catalogSource='local'}}
function syncViewportHeight(){const vv=window.visualViewport,h=vv?vv.height:window.innerHeight,top=vv?vv.offsetTop:0,keyboard=Math.max(0,window.innerHeight-h-top);document.documentElement.style.setProperty('--vvh',h+'px');document.documentElement.style.setProperty('--keyboard',keyboard+'px')}
syncViewportHeight();if(window.visualViewport){window.visualViewport.addEventListener('resize',syncViewportHeight);window.visualViewport.addEventListener('scroll',syncViewportHeight)}
const debug=new URLSearchParams(location.search).get('debug');
if(debug==='swipe'){state.route='onboard';state.on=7}
if(/^on[1-8]$/.test(debug||'')){state.route='onboard';state.on=Number(debug.slice(2))-1}
if(debug==='week'){state.route='app';state.tab='week'}
if(debug==='detail'){state.route='app';state.tab='week';state.detail=true}
if(debug==='detailings'){state.route='app';state.tab='week';state.detail=true;state.acc='ings'}
if(debug==='detailprep'){state.route='app';state.tab='week';state.detail=true;state.acc='prep'}
if(debug==='shop'){state.route='app';state.tab='shop'}
if(debug==='settings'){state.route='app';state.tab='settings'}
loadSupabaseCatalog().finally(()=>{
render();
if(debug==='shopdrawer')setTimeout(()=>{state.route='app';state.tab='shop';render();openProductDrawer()},0)
if(debug==='ingdrawer')setTimeout(()=>{state.route='app';state.tab='week';state.detail=true;state.acc='ings';render();openIngredientDrawer()},0)
if(debug==='dishdrawer')setTimeout(()=>{state.route='app';state.tab='week';state.detail=true;render();openChangeDrawer()},0)
if(debug==='newdish')setTimeout(()=>{state.route='app';state.tab='week';state.detail=true;render();openNewDishDrawer()},0)
if(debug==='setpeople')setTimeout(()=>{state.route='app';state.tab='settings';render();openSetting('people')},0)
if(debug==='setportion')setTimeout(()=>{state.route='app';state.tab='settings';render();openSetting('portion')},0)
if(debug==='setplates')setTimeout(()=>{state.route='app';state.tab='settings';render();openSetting('plates')},0)
});
</script>
</body>
